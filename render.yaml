# ==============================================================================
# RENDER BLUEPRINT SPECIFICATION — Backend Portfolio
# ==============================================================================
# Ce fichier permet de déployer l'API Express sur Render en un clic via "Blueprints".
# Documentation : https://render.com/docs/blueprint-spec

services:
  - type: web
    name: portfolio-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_SSL
        value: "true"
